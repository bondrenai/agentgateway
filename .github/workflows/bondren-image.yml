name: Bondren image

# Builds the gateway image for the Bondren fork (see bondren/README.md) and publishes it to
# ghcr.io/<owner>/agentgateway. It builds the same Dockerfile, release profile and features as
# upstream's release workflow; only the registry, the tag scheme and the attestation differ.
#
# Tags look like bondren-v1.7.0-1 (upstream version, then the fork build number) so that they
# never match upstream's release trigger (v*.*.*).

on:
  push:
    tags:
      - "bondren-v*"
  # Manual runs need this file on the default branch, which mirrors upstream, so in practice
  # the trigger is a tag. A manual run on a branch publishes dev-<commit> instead of a release tag.
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/agentgateway

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.names.outputs.tag }}
      version: ${{ steps.names.outputs.version }}
    steps:
      - name: Derive the image tag and version
        id: names
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            # bondren-v1.7.0-1 -> image tag bondren-v1.7.0-1, binary version 1.7.0-bondren.1
            if ! [[ "$REF_NAME" =~ ^bondren-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
              echo "::error::tag $REF_NAME is not of the form bondren-vX.Y.Z-N"
              exit 1
            fi
            tag="$REF_NAME"
            version="${BASH_REMATCH[1]}-bondren.${BASH_REMATCH[2]}"
          else
            tag="dev-${GITHUB_SHA::12}"
            version="0.0.0-bondren.dev.${GITHUB_SHA::12}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Image tag $tag, version $version"

  build:
    needs: setup
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      ARCH_IMAGE: ghcr.io/${{ github.repository_owner }}/agentgateway:${{ needs.setup.outputs.tag }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The release profile (fat LTO, one codegen unit) needs more disk than a hosted runner leaves free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Each architecture is built natively, as upstream's release build does.
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.description=agentgateway with the Bondren patch set (bondren/README.md)
          tags: ${{ env.ARCH_IMAGE }}
          provenance: false
          load: true
      # Nothing is pushed unless the image passes the conformance checks.
      - name: Conformance checks (stub mode)
        run: python3 bondren/conformance/run.py "$ARCH_IMAGE"
      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed under a per-architecture tag; the publish job joins the two into the release tag.
      - name: Push
        run: docker push "$ARCH_IMAGE"

  publish:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Log in to the registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Publish the multi-arch manifest
        id: manifest
        run: |
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest; }
          index=$(digest_of "$IMAGE:$TAG")
          amd64=$(digest_of "$IMAGE:$TAG-amd64")
          arm64=$(digest_of "$IMAGE:$TAG-arm64")
          { echo "index=$index"; echo "amd64=$amd64"; echo "arm64=$arm64"; } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (manifest list)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.index }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest build provenance (linux/amd64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.amd64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest build provenance (linux/arm64)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.arm64 }}
          push-to-registry: true
          create-storage-record: false
      - name: Summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INDEX: ${{ steps.manifest.outputs.index }}
          AMD64: ${{ steps.manifest.outputs.amd64 }}
          ARM64: ${{ steps.manifest.outputs.arm64 }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
        run: |
          scope=orgs
          if [ "$OWNER_TYPE" = "User" ]; then scope=users; fi
          visibility=$(gh api "/$scope/$OWNER/packages/container/agentgateway" --jq .visibility 2>/dev/null || echo unknown)
          {
            echo "## $IMAGE:$TAG"
            echo
            echo "Pin this in the product: \`$IMAGE:$TAG@$INDEX\`"
            echo
            echo "| | digest |"
            echo "|---|---|"
            echo "| manifest list | \`$INDEX\` |"
            echo "| linux/amd64 | \`$AMD64\` |"
            echo "| linux/arm64 | \`$ARM64\` |"
            echo
            echo "Package visibility: $visibility"
            echo
            echo "Verify provenance: \`gh attestation verify oci://$IMAGE@$INDEX --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$IMAGE:$TAG"
